; Nyomtatófigyelő beállítások.
;
; Ez egy példafájl. Az első indításkor a program config.ini néven másolatot készít
; belőle, és abban kell átírni az értékeket. A config.ini-hez a program frissítésekor
; nem kell hozzányúlni (és a .gitignore miatt a verziókezelésbe sem kerül be).
; A ; és # jellel kezdődő sorok megjegyzések.

[general]
; Az SNMP v2c közösségnév, amit a nyomtatókon beállítottak.
community = public
; Milyen gyakran kérdezze le a nyomtatókat (másodperc, legalább 5).
poll_seconds = 30
; Kellékanyag-szint: sárga ennyi % alatt, piros ennyi % alatt.
; A "Hamarosan elfogy" lista és a Telegram-értesítés is a warn_pct értéket használja.
warn_pct = 20
crit_pct = 10
; Csak ritkán kell: az SNMP portja a nyomtatókon.
; snmp_port = 161
; Ezeket a nyomtatói figyelmeztetéseket nem mutatja, nem menti az előzményekbe és nem is
; értesít róluk. Vesszővel elválasztott szövegrészletek, a kis/nagybetű nem számít.
; A 016-425 a Xerox "szendergő módban van" üzenete, ami néhány percenként ki-be kapcsol.
; Üresen hagyva minden figyelmeztetés megjelenik.
ignore_alerts = 016-425

[web]
; 127.0.0.1 = csak erről a gépről érhető el az oldal.
; 0.0.0.0   = a hálózat többi gépéről is (nincs hitelesítés, csak megbízható hálózaton!).
host = 127.0.0.1
port = 8080

[printers]
; Egy sor egy nyomtató:  Megjelenített név = IP-cím
Nyomtato 1 = 192.168.1.100
Nyomtato 2 = 192.168.1.101

[history]
; Az előzmények mentése egy helyi SQLite fájlba: mikor volt egy nyomtató elérhetetlen,
; mikor jelentkezett hiba vagy fogyott el a kellékanyag, és mennyi ideig tartott.
; Az Előzmények oldalon (history.html) nézhető meg.
enabled = yes
; Ennyi napig őrzi meg az adatokat, utána törli őket.
keep_days = 365
; A fájl neve (a program mappájában jön létre).
; file = history.db

[telegram]
; Opcionális. A TELEGRAM_TOKEN és TELEGRAM_CHAT_ID környezeti változó felülírja ezeket.
; token = 123456:ABC...
; chat_id = -100123456
